<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive Data Structures Visualizer on Meteor - Explore FIFO, FILO, LILO, and LIFO with Stacks and Queues formally verified in Lean 4.">
<title>Data Structures - Meteor</title>
<link rel="icon" href="./assets/icons/icon-48.png" type="image/png" sizes="48x48">
<style>
@font-face {
    font-family: "Google Sans";
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url("./fonts/google-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root { --bg-main: black; --text-main: white; --font-stack: 'Google Sans', sans-serif; --space-lg: 20px; }
@media (prefers-reduced-motion) { * { transition: none !important; animation: none !important; } }
* { letter-spacing: 0.25%; padding: 0; margin: 0; box-sizing: border-box; outline: none; }
body, button, input { font-family: var(--font-stack); color: var(--text-main); }
body { background: var(--bg-main); }
button { cursor: pointer; background: transparent; border: none; display: flex; align-items: center; justify-content: center; }
#ds-menu-view { display: flex; flex-direction: column; align-items: center; padding: 50px var(--space-lg); width: 100%; min-height: 100dvh; }
.ds-title { font-size: 24px; font-weight: 400; margin-bottom: 30px; }
.ds-mode-nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
.ds-mode-btn { background: transparent; border: 1px solid #444; color: #888; padding: 8px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
.ds-mode-btn:hover { border-color: #888; color: #fff; }
.ds-mode-btn.active { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
.ds-persp-container { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
.ds-persp-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid #333; color: #aaa; padding: 5px 14px; border-radius: 14px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.ds-persp-btn.active { background: #38bdf8; color: #000; border-color: #38bdf8; font-weight: 600; }
.ds-stage-wrapper { width: 100%; max-width: 760px; min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; }
.ds-stack-chamber { width: 180px; height: 260px; border: 3px solid #555; border-top: none; border-radius: 0 0 12px 12px; display: flex; flex-direction: column-reverse; align-items: center; padding: 6px; gap: 6px; position: relative; background: rgba(255, 255, 255, 0.02); }
.ds-stack-item { width: 100%; height: 34px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 13px; font-weight: 600; transition: all 0.25s ease; }
.ds-stack-item.ds-primary-focus { border-color: #4ade80; box-shadow: 0 0 10px rgba(74, 222, 128, 0.4); }
.ds-queue-pipe { width: 100%; max-width: 580px; height: 70px; border-top: 3px solid #555; border-bottom: 3px solid #555; display: flex; align-items: center; padding: 0 10px; gap: 8px; position: relative; background: rgba(255, 255, 255, 0.02); overflow-x: auto; }
.ds-queue-labels { display: flex; justify-content: space-between; width: 100%; max-width: 580px; font-size: 11px; color: #777; margin-top: 4px; padding: 0 6px; }
.ds-queue-item { min-width: 75px; height: 46px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; transition: all 0.25s ease; flex-shrink: 0; }
.ds-queue-item.ds-primary-focus { border-color: #4ade80; box-shadow: 0 0 10px rgba(74, 222, 128, 0.4); }
.ds-badge { font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 700; }
.ds-badge-top, .ds-badge-front { background: rgba(74, 222, 128, 0.2); color: #4ade80; }
.ds-badge-bottom, .ds-badge-rear { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
.ds-controls-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; max-width: 700px; margin-bottom: 16px; }
.ds-input-val { width: 70px; height: 36px; background: #111; border: 1px solid #444; border-radius: 10px; text-align: center; font-size: 14px; }
.btn-ds-ctrl { background: transparent; border: 1px solid #555; color: #fff; padding: 7px 16px; border-radius: 18px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.btn-ds-ctrl:hover { border-color: #888; background: rgba(255, 255, 255, 0.05); }
.btn-ds-ctrl.primary { background: #38bdf8; border-color: #38bdf8; color: #000; font-weight: 600; }
.btn-ds-ctrl.primary:hover { background: #0284c7; }
.ds-status-box { font-size: 13px; color: #aaa; text-align: center; max-width: 640px; min-height: 38px; line-height: 1.4; padding: 8px 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid #222; border-radius: 10px; margin-bottom: 24px; }
.ds-dual-container { display: flex; gap: 24px; width: 100%; max-width: 740px; justify-content: center; flex-wrap: wrap; }
.ds-dual-card { flex: 1; min-width: 280px; background: #0c0c0c; border: 1px solid #222; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; align-items: center; }
.ds-dual-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #38bdf8; }
.ds-dual-box { width: 100%; height: 90px; border: 1px dashed #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; overflow-x: auto; margin-bottom: 12px; }
.ds-dual-item { min-width: 44px; height: 38px; background: #1e293b; border: 1px solid #38bdf8; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
.ds-dual-out { font-size: 13px; color: #4ade80; font-weight: 600; min-height: 22px; word-break: break-all; }
.ds-lean-container { display: flex; justify-content: center; padding-bottom: 40px; width: 100%; }
.btn-lean-verify { display: inline-flex; align-items: center; gap: 8px; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; padding: 7px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s; text-decoration: none; }
.btn-lean-verify:hover { background: rgba(34, 197, 94, 0.18); border-color: #4ade80; transform: translateY(-1px); }
.lean-check { font-weight: 700; color: #4ade80; }
.ds-hidden { display: none !important; }
.ds-push-in { animation: animPushIn 0.25s ease-out; }
.ds-pop-out { animation: animPopOut 0.25s ease-out forwards; }
.ds-enqueue-in { animation: animEnqueueIn 0.25s ease-out; }
.ds-dequeue-out { animation: animDequeueOut 0.25s ease-out forwards; }
.ds-highlight { box-shadow: 0 0 14px #eab308 !important; border-color: #eab308 !important; }
.ds-warning-flash { border-color: #ef4444 !important; }
@keyframes animPushIn { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes animPopOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-30px); opacity: 0; } }
@keyframes animEnqueueIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes animDequeueOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-30px); opacity: 0; } }
.ds-modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.ds-modal-card { background: #121212; border: 1px solid #333; border-radius: 16px; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; gap: 16px; }
.ds-modal-header { display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 14px; }
.ds-modal-title { font-size: 18px; font-weight: 600; color: #fff; }
.ds-tier-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; margin-top: 4px; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
.ds-modal-subtitle { font-size: 12px; color: #888; margin-top: 4px; }
.ds-modal-close { background: transparent; border: none; font-size: 24px; line-height: 1; color: #888; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: color 0.15s; }
.ds-modal-close:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.ds-modal-tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid #222; padding-bottom: 12px; }
.ds-tab-btn { background: rgba(255, 255, 255, 0.04); border: 1px solid #2a2a2a; color: #aaa; padding: 6px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.ds-tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; border-color: #444; }
.ds-tab-btn.active { background: #22c55e; color: #000; font-weight: 600; border-color: #22c55e; }
.ds-proof-guarantees { display: flex; flex-direction: column; gap: 8px; }
.ds-guarantee-item { background: rgba(255, 255, 255, 0.03); border: 1px solid #262626; border-radius: 10px; padding: 10px 14px; }
.ds-guarantee-title { font-size: 13px; font-weight: 600; color: #38bdf8; margin-bottom: 2px; }
.ds-guarantee-desc { font-size: 12px; color: #bbb; line-height: 1.4; }
.ds-proof-tips { display: flex; flex-direction: column; gap: 8px; }
.ds-tip-item { background: rgba(56, 189, 248, 0.04); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 10px; padding: 10px 14px; }
.ds-tip-title { font-size: 13px; font-weight: 600; color: #38bdf8; margin-bottom: 2px; }
.ds-tip-desc { font-size: 12px; color: #ccc; line-height: 1.4; }
.ds-code-container { background: #080808; border: 1px solid #222; border-radius: 10px; padding: 14px; overflow-x: auto; font-family: monospace; font-size: 12px; color: #e5e5e5; line-height: 1.5; }
.ds-code-container pre { margin: 0; white-space: pre; }
.ds-modal-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 6px; padding-top: 14px; border-top: 1px solid #222; }
.btn-ds-action { background: transparent; border: 1px solid #444; color: #e5e5e5; padding: 8px 16px; border-radius: 12px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn-ds-action:hover { border-color: #888; background: rgba(255, 255, 255, 0.05); }
.btn-ds-action.primary { background: #22c55e; border-color: #22c55e; color: #000; font-weight: 600; }
.btn-ds-action.primary:hover { background: #16a34a; }
</style>
</head>
<body>
<main id="ds-menu-view">
    <h2 class="ds-title">Data Structures</h2>
    <div class="ds-mode-nav">
        <button id="btn-mode-stack" class="ds-mode-btn active">Stack (LIFO / FILO)</button>
        <button id="btn-mode-queue" class="ds-mode-btn">Queue (FIFO / LILO)</button>
        <button id="btn-mode-dual" class="ds-mode-btn">Bandingkan (Dual)</button>
    </div>
    <div id="view-stack" class="ds-stage-wrapper">
        <div class="ds-persp-container">
            <button id="btn-stack-lifo" class="ds-persp-btn active">Perspektif LIFO</button>
            <button id="btn-stack-filo" class="ds-persp-btn">Perspektif FILO</button>
        </div>
        <div id="stack-container" class="ds-stack-chamber"></div>
        <div class="ds-controls-bar" style="margin-top: 20px;">
            <input type="number" id="input-stack-val" class="ds-input-val" placeholder="Nilai" min="1" max="999">
            <button id="btn-stack-push" class="btn-ds-ctrl primary">Push</button>
            <button id="btn-stack-pop" class="btn-ds-ctrl">Pop</button>
            <button id="btn-stack-peek" class="btn-ds-ctrl">Peek</button>
            <button id="btn-stack-rand" class="btn-ds-ctrl">Acak</button>
            <button id="btn-stack-clear" class="btn-ds-ctrl">Clear</button>
        </div>
        <div id="stack-status" class="ds-status-box"></div>
    </div>
    <div id="view-queue" class="ds-stage-wrapper ds-hidden">
        <div class="ds-persp-container">
            <button id="btn-queue-fifo" class="ds-persp-btn active">Perspektif FIFO</button>
            <button id="btn-queue-lilo" class="ds-persp-btn">Perspektif LILO</button>
        </div>
        <div id="queue-container" class="ds-queue-pipe"></div>
        <div class="ds-queue-labels">
            <span>◀ Front (Exit / Dequeue)</span>
            <span>Rear (Enter / Enqueue) ◀</span>
        </div>
        <div class="ds-controls-bar" style="margin-top: 20px;">
            <input type="number" id="input-queue-val" class="ds-input-val" placeholder="Nilai" min="1" max="999">
            <button id="btn-queue-enqueue" class="btn-ds-ctrl primary">Enqueue</button>
            <button id="btn-queue-dequeue" class="btn-ds-ctrl">Dequeue</button>
            <button id="btn-queue-peek" class="btn-ds-ctrl">Peek</button>
            <button id="btn-queue-rand" class="btn-ds-ctrl">Acak</button>
            <button id="btn-queue-clear" class="btn-ds-ctrl">Clear</button>
        </div>
        <div id="queue-status" class="ds-status-box"></div>
    </div>
    <div id="view-dual" class="ds-stage-wrapper ds-hidden">
        <div class="ds-controls-bar">
            <input type="text" id="input-dual-stream" class="ds-input-val" style="width: 200px;" value="10, 20, 30, 40">
            <button id="btn-dual-run" class="btn-ds-ctrl primary">Jalankan Simulasi Stream</button>
            <button id="btn-dual-reset" class="btn-ds-ctrl">Reset</button>
        </div>
        <div class="ds-dual-container">
            <div class="ds-dual-card">
                <h4>Stack (LIFO / FILO)</h4>
                <div id="dual-stack-box" class="ds-dual-box"></div>
                <div style="font-size: 11px; color: #888; margin-bottom: 4px;">Urutan Keluar:</div>
                <div id="dual-stack-out" class="ds-dual-out">-</div>
            </div>
            <div class="ds-dual-card">
                <h4>Queue (FIFO / LILO)</h4>
                <div id="dual-queue-box" class="ds-dual-box"></div>
                <div style="font-size: 11px; color: #888; margin-bottom: 4px;">Urutan Keluar:</div>
                <div id="dual-queue-out" class="ds-dual-out">-</div>
            </div>
        </div>
        <div id="dual-status" class="ds-status-box" style="margin-top: 20px;"></div>
    </div>
    <div class="ds-lean-container">
        <button id="btn-lean-verify" class="btn-lean-verify" aria-haspopup="dialog">
            <span class="lean-check">✓</span>
            <span id="lean-badge-text">Stack (LIFO / FILO): Formally Verified in Lean 4</span>
        </button>
    </div>
</main>
<script type="module" src="./src/lab/ds/ds-controller.js?v=1"></script>
</body>
</html>

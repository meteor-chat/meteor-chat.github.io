<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<meta name="description" content="Line Chart Studio on Meteor - Visualisasi grafik garis multi-seri berpresisi tinggi, kurva monotonik tanpa overshoot, regresi OLS, dan ekspor SVG vektor.">
<title>Line Chart Studio - Meteor</title>
<link rel="icon" href="./assets/icons/icon-48.png" type="image/png" sizes="48x48">
<link rel="stylesheet" href="./styles/linechart.css">
<style>
@font-face {
    font-family: "Google Sans";
    font-style: normal;
    font-weight: 400 600 700;
    font-display: swap;
    src: url("./fonts/google-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
    font-family: "Roboto Mono";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("./fonts/roboto-mono-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
* { letter-spacing: 0.25%; padding: 0; margin: 0; box-sizing: border-box; outline: none; }
body, a { font-family: 'Google Sans', sans-serif; color: #ffffff; }
body { background: #07080c; }
</style>
</head>
<body>
<div id="line-app-root" class="line-page-wrapper">
    <header class="line-nav-header">
        <div class="line-title-area">
            <h1 class="line-header-title">Line Chart Studio</h1>
            <span class="line-header-badge">Tren &amp; Deret Waktu</span>
        </div>
        <a href="/plot" class="line-back-btn" aria-label="Kembali ke Plot"><img src="./assets/svg/back.svg" alt="Kembali" width="36" height="36"></a>
    </header>

    <div class="line-main-grid">
        <aside class="line-controls-col">
            <div class="line-card">
                <div class="line-card-title">
                    <span>Data Deret &amp; Multi-Seri</span>
                    <span style="font-size:10px;color:#64748b;font-family:monospace;">CSV / TSV</span>
                </div>
                <div class="line-preset-group">
                    <button type="button" id="line-preset-climate" class="line-btn-preset">Suhu Global</button>
                    <button type="button" id="line-preset-traffic" class="line-btn-preset">Trafik &amp; Null</button>
                    <button type="button" id="line-preset-telemetry" class="line-btn-preset">Sensor 160 Titik</button>
                    <button type="button" id="line-preset-adoption" class="line-btn-preset">SLA Step (%)</button>
                </div>
                <textarea id="line-input-text" class="line-textarea" placeholder="Format: X, Seri 1, Seri 2"></textarea>
            </div>

            <div class="line-card">
                <div class="line-card-title">Interpolasi &amp; Sumbu</div>
                <div class="line-control-group">
                    <div class="line-label-row"><label for="line-opt-mode">Jenis Kurva</label></div>
                    <select id="line-opt-mode" class="line-select-input">
                        <option value="monotone" selected>Monotone Cubic (Tanpa Overshoot)</option>
                        <option value="linear">Linear Lurus (Eksak)</option>
                        <option value="step">Step / Tangga (Diskrit)</option>
                    </select>
                </div>
                <div class="line-control-group">
                    <div class="line-label-row"><label for="line-opt-markers">Titik Penanda</label></div>
                    <select id="line-opt-markers" class="line-select-input">
                        <option value="auto" selected>Adaptif (Otomatis Padat)</option>
                        <option value="show">Selalu Tampilkan</option>
                        <option value="hide">Sembunyikan (Hanya Terisolasi)</option>
                    </select>
                </div>
                <div class="line-control-group">
                    <div class="line-label-row">
                        <span>Jendela Rentang X</span>
                        <span id="line-opt-range-val" class="line-val-badge">0% - 100%</span>
                    </div>
                    <div class="line-range-pair">
                        <input type="range" id="line-opt-range-start" class="line-range-input" min="0" max="95" step="5" value="0" aria-label="Rentang awal X">
                        <input type="range" id="line-opt-range-end" class="line-range-input" min="5" max="100" step="5" value="100" aria-label="Rentang akhir X">
                    </div>
                </div>
                <label class="line-toggle-row">
                    <input type="checkbox" id="line-opt-zero">
                    <span>Mulai Sumbu Y dari Nol</span>
                </label>
                <label class="line-toggle-row">
                    <input type="checkbox" id="line-opt-nulls">
                    <span>Sambungkan Celah Data Kosong</span>
                </label>
            </div>

            <div class="line-card">
                <div class="line-card-title">Gaya &amp; Analisis</div>
                <div class="line-control-group">
                    <div class="line-label-row"><label for="line-opt-palette">Palet Warna</label></div>
                    <select id="line-opt-palette" class="line-select-input">
                        <option value="okabe_ito" selected>Okabe-Ito (Scientific / Colorblind)</option>
                        <option value="ocean">Ocean Cyan &amp; Indigo</option>
                        <option value="aurora">Aurora Emerald</option>
                        <option value="ember">Warm Ember</option>
                        <option value="monochrome">Monochrome Silver</option>
                    </select>
                </div>
                <div class="line-control-group">
                    <div class="line-label-row">
                        <label for="line-opt-width">Tebal Garis</label>
                        <span id="line-opt-width-val" class="line-val-badge">2.4px</span>
                    </div>
                    <input type="range" id="line-opt-width" class="line-range-input" min="1.2" max="5" step="0.2" value="2.4">
                </div>
                <label class="line-toggle-row">
                    <input type="checkbox" id="line-opt-area">
                    <span>Gradien Area Bawah Garis</span>
                </label>
                <label class="line-toggle-row">
                    <input type="checkbox" id="line-opt-mean" checked>
                    <span>Garis Rata-rata Referensi</span>
                </label>
                <label class="line-toggle-row">
                    <input type="checkbox" id="line-opt-trend" checked>
                    <span>Garis Tren Regresi Linear</span>
                </label>
                <label class="line-toggle-row">
                    <input type="checkbox" id="line-opt-region">
                    <span>Sorot Zona Periode (58% - 86%)</span>
                </label>
            </div>

            <div class="line-card">
                <div class="line-card-title">Ekspor &amp; Bagikan</div>
                <div class="line-actions-row">
                    <button type="button" id="line-btn-export-png" class="line-btn-action line-btn-primary">PNG</button>
                    <button type="button" id="line-btn-export-svg" class="line-btn-action line-btn-primary">SVG Vektor</button>
                    <button type="button" id="line-btn-export-csv" class="line-btn-action line-btn-secondary">Unduh CSV</button>
                    <button type="button" id="line-btn-copy-svg" class="line-btn-action line-btn-secondary">Salin SVG</button>
                </div>
            </div>
        </aside>

        <section class="line-viewport-col">
            <div class="line-metrics-banner">
                <div class="line-metric-tile">
                    <span class="line-metric-label">Titik Data</span>
                    <span id="line-stat-points" class="line-metric-num">0</span>
                </div>
                <div class="line-metric-tile">
                    <span class="line-metric-label">Rentang Y</span>
                    <span id="line-stat-range" class="line-metric-num">-</span>
                </div>
                <div class="line-metric-tile">
                    <span class="line-metric-label">Rata-rata</span>
                    <span id="line-stat-mean" class="line-metric-num">-</span>
                </div>
                <div class="line-metric-tile">
                    <span class="line-metric-label">Delta</span>
                    <span id="line-stat-delta" class="line-metric-num">-</span>
                </div>
                <div class="line-metric-tile">
                    <span class="line-metric-label">Slope Tren</span>
                    <span id="line-stat-slope" class="line-metric-num">-</span>
                </div>
                <div class="line-metric-tile">
                    <span class="line-metric-label">Fit R^2</span>
                    <span id="line-stat-r2" class="line-metric-num">-</span>
                </div>
            </div>

            <div id="line-legend-bar" class="line-legend-bar" aria-label="Legenda interaktif seri data"></div>

            <div class="line-canvas-container">
                <canvas id="line-canvas"></canvas>
            </div>
        </section>
    </div>
</div>

<script type="module" src="./src/plot/linechart/linechart-app.js"></script>
</body>
</html>

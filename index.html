<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Meteor is a minimalist AI chat platform and interactive STEM laboratory featuring real-time mathematical visualizations and sorting algorithm simulations without requiring login.">
<title>Meteor</title>
<link rel="icon" href="./icon-48.png" type="image/png" sizes="48x48">
<link rel="preload" as="image" href="./banner-768.webp" type="image/webp" media="(max-width: 768px)" fetchpriority="high">
<link rel="preload" as="image" href="./banner.webp" type="image/webp" media="(min-width: 769px)" fetchpriority="high">
<link rel="modulepreload" href="./main.js?v=6">
<link rel="modulepreload" href="./input-controls.js">
<link rel="modulepreload" href="./dom-refs.js">
<link rel="modulepreload" href="./app-state.js">
<link rel="modulepreload" href="./error-view.js">
<style>
@font-face {
    font-family: "Google Sans";
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url("./fonts/google-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root { --bg-main: black; --text-main: white; --text-muted: #afafaf; --text-assist: #e0e0e0; --border-input: #414141; --bg-user-bubble: #072d71; --bg-code: #161b22; --bg-code-inline: #1e1e2e; --text-code: #e6edf3; --text-code-inline: #ff7b72; --border-code: #30363d; --quote-border: #3b82f6; --quote-bg: linear-gradient(90deg, rgba(59,130,246,0.1) 0%, transparent 100%); --font-stack: 'Google Sans', sans-serif; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 26px; --radius-bubble: 28px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 20px; --space-xl: 24px; --space-xxl: 32px; }
@media (prefers-reduced-motion) { * { transition: none !important; animation: none !important; } }
* { letter-spacing: 0.25%; padding: 0; margin: 0; box-sizing: border-box; outline: none; }
body, textarea, input, button { font-family: var(--font-stack); color: var(--text-main); }
body { background: var(--bg-main); }
button { cursor: pointer; background: transparent; border: none; display: flex; align-items: center; justify-content: center; padding: 0; }
.hidden { display: none !important; }
.error-box { color: red; text-align: center; margin-bottom: 10px; }
.error-box-fallback { display: block; margin: 2rem; }
.app-main { display: flex; flex-direction: column; width: 100%; min-height: 100dvh; }
.landing { display: flex; flex-direction: column; align-items: center; gap: var(--space-xxl); justify-content: center; height: 100dvh; }
.banner { position: fixed; z-index: -1; top: 0; left: 0; right: 0; margin: 0 auto; width: 100%; max-width: 768px; pointer-events: none; }
.banner img { width: 100%; height: auto; display: block; }
.tagline h1 { font-weight: 400; font-size: 32px; }
.home-nav-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 30px; }
.btn-home-nav { background-color: #333; color: var(--text-main); text-decoration: none; padding: 10px 24px; border-radius: 24px; font-size: 14px; font-weight: 500; font-family: inherit; transition: opacity 0.2s; }
.btn-home-nav:hover { opacity: 0.8; }
.input-wrap { display: flex; flex-direction: column; position: relative; border: solid 1px var(--border-input); border-radius: var(--radius-xl); width: calc(100% - var(--space-xxl)); max-width: 768px; margin: 0 auto; z-index: 1; }
textarea { width: 100%; height: 52px; resize: none; background: transparent; padding: 17px 52px 15px 26px; line-height: 20px; font-size: 16px; border: none; overflow-y: auto; scrollbar-width: none; }
textarea::-webkit-scrollbar { display: none; }
textarea::placeholder { font-size: 16px; color: var(--text-muted); }
.send-landing, #send-chat { position: absolute; bottom: var(--space-xs); right: var(--space-xs); }
@media (max-width: 768px) {
    .tagline h1 { font-size: 24px; text-align: center; padding: 0 var(--space-md); }
    .input-wrap { width: calc(100% - var(--space-xl)); }
}
</style>
</head>
<body>
<div id="error-box" class="hidden error-box"></div>
<main id="app-main" class="app-main">
<div id="landing" class="landing">
<picture class="banner">
<source type="image/webp" media="(max-width: 768px)" srcset="./banner-768.webp">
<source type="image/webp" srcset="./banner.webp">
<source media="(max-width: 768px)" srcset="./banner-768.png">
<img src="./banner.png" alt="Meteor Banner" width="768" height="256" fetchpriority="high">
</picture>
<div class="tagline"><h1>Minimalist. No Login. Meteor</h1></div>
<div class="input-wrap">
<textarea id="message-landing" placeholder="Ask Meteor" rows="1"></textarea>
<button id="send-landing" class="send-landing" aria-label="Send"><img src="send-inactive.svg" alt="Send" width="36" height="36"></button>
</div>
<div class="home-nav-buttons"><a href="/math" class="btn-home-nav">Math</a><a href="/sort" class="btn-home-nav">Sort</a><a href="/ds" class="btn-home-nav">DS</a><a href="/search" class="btn-home-nav">Search</a></div>
</div>
<div id="chat-view" class="hidden">
<div id="chat-messages" aria-live="polite">
<div id="conversation"></div>
</div>
<div class="input-wrap">
<div id="edit-notice" class="hidden">Editing message</div>
<button id="cancel-btn" class="hidden">Cancel</button>
<textarea id="message-chat" placeholder="Ask Meteor" rows="1"></textarea>
<button id="send-chat" aria-label="Send"><img src="send-inactive.svg" alt="Send" width="36" height="36"></button>
<button id="stop-chat" class="stop-btn hidden" aria-label="Stop"><img src="stop.svg" alt="Stop" width="24" height="24"></button>
</div>
</div>
</main>
<script type="module" src="main.js?v=6"></script>
</body>
</html>

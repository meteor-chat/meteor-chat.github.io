<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Meteor is a minimalist AI chat platform and interactive STEM laboratory featuring real-time mathematical visualizations and sorting algorithm simulations without requiring login.">
<title>Meteor</title>
<link rel="icon" href="./icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="./banner-768.webp" type="image/webp" media="(max-width: 768px)" fetchpriority="high">
<link rel="preload" as="image" href="./banner.webp" type="image/webp" media="(min-width: 769px)" fetchpriority="high">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./layout.css">
<link rel="stylesheet" href="./input.css">
<link rel="stylesheet" href="./responsive.css">
<link rel="stylesheet" href="./messages.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="./messages.css"></noscript>
<link rel="stylesheet" href="./markdown.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="./markdown.css"></noscript>
<link rel="stylesheet" href="./math.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="./math.css"></noscript>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..600;1,17..18,400..600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..600;1,17..18,400..600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..600;1,17..18,400..600&display=swap"></noscript>
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"></noscript>
</head>
<body>
<div id="error-box" class="hidden error-box"></div>
<main id="app-main" class="app-main">
<div id="landing" class="landing">
<picture class="banner">
<source type="image/webp" media="(max-width: 768px)" srcset="./banner-768.webp">
<source type="image/webp" srcset="./banner.webp">
<source media="(max-width: 768px)" srcset="./banner-768.png">
<img src="./banner.png" alt="Meteor Banner" width="768" height="256" fetchpriority="high" decoding="async">
</picture>
<div class="tagline"><h1>Minimalist. No Login. Meteor</h1></div>
<div class="input-wrap">
<textarea id="message-landing" placeholder="Ask Meteor" rows="1"></textarea>
<button id="send-landing" class="send-landing" aria-label="Send"><img src="send-inactive.svg" alt="Send" width="36" height="36"></button>
</div>
<div class="home-nav-buttons"><a href="/math" class="btn-home-nav">Math</a><a href="/sort" class="btn-home-nav">Sort</a></div>
</div>
<div id="chat-view" class="hidden">
<div id="chat-messages" aria-live="polite">
<div id="conversation"></div>
</div>
<div class="input-wrap">
<div id="edit-notice" class="hidden">Editing message</div>
<button id="cancel-btn" class="hidden">Cancel</button>
<textarea id="message-chat" placeholder="Ask Meteor" rows="1"></textarea>
<button id="send-chat" aria-label="Send"><img src="send-inactive.svg" alt="Send" width="36" height="36"></button>
<button id="stop-chat" class="stop-btn hidden" aria-label="Stop"><img src="stop.svg" alt="Stop" width="24" height="24"></button>
</div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" defer></script>
<script type="module" src="main.js?v=4"></script>
</body>
</html>

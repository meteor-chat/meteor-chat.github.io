<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meteor</title>
<link rel="icon" href="./icon.png" type="image/png">
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./layout.css">
<link rel="stylesheet" href="./input.css">
<link rel="stylesheet" href="./messages.css">
<link rel="stylesheet" href="./markdown.css">
<link rel="stylesheet" href="./math.css">
<link rel="stylesheet" href="./responsive.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
<div id="error-box" class="hidden error-box"></div>
<div id="landing" class="landing">
    <img src="./banner.png" class="banner" alt="Banner">
    <div class="tagline"><h1>Minimalist. No Login. Meteor</h1></div>
    <div class="input-wrap">
        <textarea id="message-landing" placeholder="Ask Meteor" rows="1"></textarea>
        <button id="send-landing" class="send-landing" aria-label="Send"><img src="send-inactive.svg" alt="Send"></button>
    </div>
    <button id="btn-math-eor" class="btn-math-eor">Math eor</button>
</div>
<div id="chat-view" class="hidden">
    <div id="chat-messages" aria-live="polite">
        <div id="conversation"></div>
    </div>
    <div class="input-wrap">
        <div id="edit-notice" class="hidden">Editing message</div>
        <button id="cancel-btn" class="hidden">Cancel</button>
        <textarea id="message-chat" placeholder="Ask Meteor" rows="1"></textarea>
        <button id="send-chat" aria-label="Send"><img src="send-inactive.svg" alt="Send"></button>
        <button id="stop-chat" class="stop-btn hidden" aria-label="Stop"><img src="stop.svg" alt="Stop"></button>
    </div>
</div>
<div id="math-menu-view" class="hidden">
    <h2 class="math-title">Pilihan Rumus</h2>
    <div class="math-grid">
        <button class="math-card active" data-formula="1" id="math-card-1"></button>
        <button class="math-card active" data-formula="2" id="math-card-2"></button>
        <button class="math-card disabled">rumus lain<br>coming soon</button>
        <button class="math-card disabled">rumus lain<br>coming soon</button>
        <button class="math-card disabled">rumus lain<br>coming soon</button>
        <button class="math-card disabled">rumus lain<br>coming soon</button>
        <button class="math-card disabled">rumus lain<br>coming soon</button>
        <button class="math-card disabled">rumus lain<br>coming soon</button>
        <button class="math-card disabled">rumus lain<br>coming soon</button>
    </div>
    <button id="btn-math-menu-back" class="btn-math-back">Kembali</button>
</div>
<div id="math-calc-view" class="hidden">
    <h2 class="math-title">Pilihan Rumus</h2>
    <div id="math-calc-form-1" class="math-calc-container hidden">
        <div class="math-calc-left">
            <div id="math-calc-formula-display" class="math-formula-box"></div>
            <button id="btn-math-calc-back" class="btn-math-back" style="margin-top:40px;">Kembali</button>
        </div>
        <div class="math-calc-right">
            <div class="math-inputs">
                <div class="math-input-group">
                    <label>kromosom (user input) (misalnya 1011)</label>
                    <input type="text" id="math-in-kromosom" placeholder="1011">
                </div>
                <div class="math-input-group">
                    <label>x min (user input) (misalnya -2)</label>
                    <input type="number" id="math-in-xmin" placeholder="-2" step="any">
                </div>
                <div class="math-input-group">
                    <label>x max (user input) (misalnya 3)</label>
                    <input type="number" id="math-in-xmax" placeholder="3" step="any">
                </div>
                <div class="math-input-group">
                    <label>n (auto terisi berdasarkan kromosom)</label>
                    <input type="number" id="math-in-n" disabled>
                </div>
            </div>
            <div class="math-steps" id="math-steps-container"></div>
        </div>
    </div>
    
    <div id="math-calc-form-2" class="math-calc-container hidden">
        <div class="math-calc-left" style="min-width: 350px;">
            <div id="math-calc-formula-display-2" class="math-formula-box" style="display:flex;flex-direction:column;gap:20px;"></div>
            <button id="btn-math-calc-back-2" class="btn-math-back" style="margin-top:40px;">Kembali</button>
        </div>
        <div class="math-calc-right" style="flex:2;">
            <div class="math-inputs" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);">
                <div class="math-input-group">
                    <label>r min</label>
                    <input type="number" id="math2-in-rmin" value="-2" step="any">
                </div>
                <div class="math-input-group">
                    <label>r max</label>
                    <input type="number" id="math2-in-rmax" value="3" step="any">
                </div>
                <div class="math-input-group" style="grid-column: span 2;">
                    <label>Objective Function h(x1, x2) (JS Expression)</label>
                    <input type="text" id="math2-in-func" value="Math.pow(x1, 3) + (1/3)*Math.pow(x2, 2)">
                </div>
                <div class="math-input-group">
                    <label>Objective Mode</label>
                    <select id="math2-in-mode" style="background:transparent; color:var(--text-main); border:none; border-bottom:1px solid #333; padding:4px 0; outline:none; font-family:inherit;">
                        <option value="min" style="color:#000;">Minimizing</option>
                        <option value="max" style="color:#000;">Maximizing</option>
                    </select>
                </div>
                <div class="math-input-group">
                    <label>Parameter 'a'</label>
                    <input type="number" id="math2-in-a" value="0.10" step="any">
                </div>
                <div class="math-input-group" style="grid-column: span 2;">
                    <label>Populasi (Kromosom per baris)</label>
                    <textarea id="math2-in-pop" rows="8" style="background:transparent; border:1px solid #333; border-radius:8px; color:var(--text-main); padding:8px; font-family:monospace; resize:vertical; outline:none;">
000010
001011
010110
011111
100000
101001
110100
111101</textarea>
                </div>
            </div>
            <div class="math-steps" style="align-items: flex-start; overflow-x: auto; width: 100%; margin-top: 20px;">
                <div id="math2-table-container"></div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script type="module" src="main.js?v=2"></script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman Tidak Ditemukan - Meteor</title>
<base href="/">
<script type="module">
import { parseFormulaUrl, getFormulaUrl } from "./src/math/math-routes.js";
const p = window.location.pathname.replace(/\/+$/, "");
const route = parseFormulaUrl(p);
if (route) {
    window.location.replace(getFormulaUrl(route.id));
} else if (p.startsWith("/math")) {
    window.location.replace("/math");
} else if (p === "/centrality") {
    window.location.replace("/centrality.html");
} else if (p === "/patterns") {
    window.location.replace("/patterns.html");
} else if (p === "/boids") {
    window.location.replace("/boids.html");
} else if (p === "/cipher") {
    window.location.replace("/cipher.html");
} else if (p === "/lcg") {
    window.location.replace("/lcg.html");
} else if (p === "/lab") {
    window.location.replace("/lab.html");
} else {
    window.location.replace("/");
}
</script>
<style>
body { background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
a { color: #38bdf8; text-decoration: none; }
.btn-math-back { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; }
.btn-math-back:hover img { transform: scale(1.08); }
.btn-math-back img { display: block; width: 36px; height: 36px; border-radius: 50%; transition: transform 0.15s ease; }
</style>
</head>
<body>
<div>
<p>Mengalihkan...</p>
<p><a href="/math" class="btn-math-back" aria-label="Kembali ke Math"><img src="./assets/svg/back.svg" alt="Kembali" width="36" height="36"></a></p>
</div>
</body>
</html>

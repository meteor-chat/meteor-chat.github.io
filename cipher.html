<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive Caesar Cipher on Meteor - Rotate the 60 FPS cryptographic cipher disk, inspect brute-force rotations, and verify modular arithmetic formally in Lean 4.">
<title>Caesar Cipher - Meteor</title>
<link rel="icon" href="./icon-48.png" type="image/png" sizes="48x48">
<style>
@font-face {
    font-family: "Google Sans";
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url("./fonts/google-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root { --bg-main: black; --text-main: white; --font-stack: 'Google Sans', sans-serif; --space-lg: 20px; }
@media (prefers-reduced-motion) { * { transition: none !important; animation: none !important; } }
* { letter-spacing: 0.25%; padding: 0; margin: 0; box-sizing: border-box; outline: none; }
body, button, textarea, input { font-family: var(--font-stack); color: var(--text-main); }
body { background: var(--bg-main); }
button { cursor: pointer; background: transparent; border: none; display: flex; align-items: center; justify-content: center; }
#cipher-menu-view { display: flex; flex-direction: column; align-items: center; padding: 50px var(--space-lg); width: 100%; min-height: 100dvh; }
.cipher-title { font-size: 24px; font-weight: 400; margin-bottom: 6px; }
.cipher-desc { font-size: 13px; color: #888; margin-bottom: 24px; text-align: center; }
.cipher-mode-nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
.cipher-nav-btn { background: transparent; border: 1px solid #444; color: #888; padding: 7px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.cipher-nav-btn:hover { border-color: #888; color: #fff; }
.cipher-nav-btn.active { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
.cipher-controls-panel { width: 100%; max-width: 640px; background: rgba(255, 255, 255, 0.02); border: 1px solid #222; border-radius: 16px; padding: 16px 20px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 14px; }
.cipher-shift-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.cipher-shift-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; }
.btn-shift-step { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #444; font-size: 16px; color: #fff; background: rgba(255, 255, 255, 0.04); transition: all 0.15s; }
.btn-shift-step:hover { background: rgba(255, 255, 255, 0.1); border-color: #888; }
.cipher-slider { flex: 1; accent-color: #38bdf8; cursor: pointer; height: 6px; }
.cipher-badge-shift { font-size: 13px; font-weight: 600; color: #38bdf8; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); padding: 4px 10px; border-radius: 12px; min-width: 70px; text-align: center; }
.btn-preset { background: rgba(255, 255, 255, 0.05); border: 1px solid #444; color: #aaa; padding: 5px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.btn-preset:hover { color: #fff; border-color: #888; }
.cipher-stage { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 740px; }
.cipher-wheel-box { position: relative; width: 340px; height: 340px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; }
.cipher-wheel-canvas { width: 340px; height: 340px; display: block; }
.cipher-io-container { width: 100%; display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.cipher-io-card { flex: 1; min-width: 280px; background: #0d0d0d; border: 1px solid #222; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.cipher-io-header { display: flex; justify-content: space-between; align-items: center; }
.cipher-io-title { font-size: 13px; font-weight: 600; color: #94a3b8; }
.cipher-dir-toggle { display: flex; gap: 4px; background: rgba(255, 255, 255, 0.05); padding: 2px; border-radius: 10px; }
.btn-dir { font-size: 11px; padding: 3px 10px; border-radius: 8px; color: #888; cursor: pointer; transition: all 0.15s; }
.btn-dir.active { background: #38bdf8; color: #000; font-weight: 600; }
.cipher-textarea { width: 100%; height: 90px; background: #050505; border: 1px solid #1a1a1a; border-radius: 10px; padding: 10px; font-size: 14px; line-height: 1.4; resize: none; color: #fff; }
.cipher-textarea:focus { border-color: #38bdf8; }
.btn-copy-out { align-self: flex-end; font-size: 12px; color: #aaa; background: transparent; border: 1px solid #333; padding: 4px 12px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
.btn-copy-out:hover { color: #fff; border-color: #666; }
.cipher-brute-wrapper { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 6px; max-height: 480px; overflow-y: auto; padding-right: 4px; margin-bottom: 24px; }
.brute-item { display: flex; align-items: center; gap: 12px; background: #0c0c0c; border: 1px solid #1f1f1f; padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: all 0.15s; }
.brute-item:hover { border-color: #444; background: #141414; }
.brute-item.highlight { border-color: #38bdf8; background: rgba(56, 189, 248, 0.06); }
.brute-shift-badge { font-size: 11px; font-weight: 600; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 2px 8px; border-radius: 6px; min-width: 60px; text-align: center; }
.brute-text { font-size: 13px; color: #cbd5e1; word-break: break-all; }
.cipher-empty-msg { font-size: 13px; color: #666; text-align: center; padding: 30px; }
.cipher-lean-container { display: flex; justify-content: center; padding-bottom: 40px; width: 100%; }
.btn-lean-verify { display: inline-flex; align-items: center; gap: 8px; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; padding: 7px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s; text-decoration: none; }
.btn-lean-verify:hover { background: rgba(34, 197, 94, 0.18); border-color: #4ade80; transform: translateY(-1px); }
.lean-check { font-weight: 700; color: #4ade80; }
.cipher-hidden { display: none !important; }
.cipher-modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.cipher-modal-card { background: #121212; border: 1px solid #333; border-radius: 16px; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; gap: 16px; }
.cipher-modal-header { display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 14px; }
.cipher-modal-title { font-size: 18px; font-weight: 600; color: #fff; }
.cipher-tier-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; margin-top: 4px; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
.cipher-modal-subtitle { font-size: 12px; color: #888; margin-top: 4px; }
.cipher-modal-close { background: transparent; border: none; font-size: 24px; line-height: 1; color: #888; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: color 0.15s; }
.cipher-modal-close:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.cipher-proof-guarantees { display: flex; flex-direction: column; gap: 8px; }
.cipher-guarantee-item { background: rgba(255, 255, 255, 0.03); border: 1px solid #262626; border-radius: 10px; padding: 10px 14px; }
.cipher-guarantee-title { font-size: 13px; font-weight: 600; color: #38bdf8; margin-bottom: 2px; }
.cipher-guarantee-desc { font-size: 12px; color: #bbb; line-height: 1.4; }
.cipher-proof-tips { display: flex; flex-direction: column; gap: 8px; }
.cipher-tip-item { background: rgba(56, 189, 248, 0.04); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 10px; padding: 10px 14px; }
.cipher-tip-title { font-size: 13px; font-weight: 600; color: #38bdf8; margin-bottom: 2px; }
.cipher-tip-desc { font-size: 12px; color: #ccc; line-height: 1.4; }
.cipher-code-container { background: #080808; border: 1px solid #222; border-radius: 10px; padding: 14px; overflow-x: auto; font-family: monospace; font-size: 12px; color: #e5e5e5; line-height: 1.5; }
.cipher-code-container pre { margin: 0; white-space: pre; }
.cipher-modal-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 6px; padding-top: 14px; border-top: 1px solid #222; }
.btn-cipher-action { background: transparent; border: 1px solid #444; color: #e5e5e5; padding: 8px 16px; border-radius: 12px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn-cipher-action:hover { border-color: #888; background: rgba(255, 255, 255, 0.05); }
.btn-cipher-action.primary { background: #22c55e; border-color: #22c55e; color: #000; font-weight: 600; }
.btn-cipher-action.primary:hover { background: #16a34a; }
</style>
</head>
<body>
<main id="cipher-menu-view">
    <h2 class="cipher-title">Caesar Cipher</h2>
    <p class="cipher-desc">Sandi substitusi klasik berbasis aritmatika modular: C = (P + k) mod 26</p>
    <div class="cipher-mode-nav">
        <button id="btn-view-wheel" class="cipher-nav-btn active">Roda Sandi (Disk)</button>
        <button id="btn-view-brute" class="cipher-nav-btn">Brute Force (26 Shifts)</button>
    </div>
    <div class="cipher-controls-panel">
        <div class="cipher-shift-row">
            <div class="cipher-shift-left">
                <button id="btn-shift-dec" class="btn-shift-step" aria-label="Kurangi shift">-</button>
                <input type="range" id="slider-shift" class="cipher-slider" min="0" max="25" value="3" aria-label="Shift key">
                <button id="btn-shift-inc" class="btn-shift-step" aria-label="Tambah shift">+</button>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <span class="cipher-badge-shift">Shift: <span id="shift-display">3</span></span>
                <button id="btn-rot13" class="btn-preset">ROT13</button>
            </div>
        </div>
    </div>
    <div class="cipher-stage">
        <div id="view-wheel-wrapper" class="cipher-wheel-box">
            <canvas id="cipher-wheel-canvas" class="cipher-wheel-canvas" width="340" height="340"></canvas>
        </div>
        <div class="cipher-io-container">
            <div class="cipher-io-card">
                <div class="cipher-io-header">
                    <span class="cipher-io-title">Teks Masukan</span>
                    <div class="cipher-dir-toggle">
                        <button id="btn-mode-encrypt" class="btn-dir active">Enkripsi</button>
                        <button id="btn-mode-decrypt" class="btn-dir">Dekripsi</button>
                    </div>
                </div>
                <textarea id="input-cipher-text" class="cipher-textarea" placeholder="Ketik teks di sini...">HELLO WORLD</textarea>
            </div>
            <div class="cipher-io-card">
                <div class="cipher-io-header">
                    <span class="cipher-io-title">Teks Hasil</span>
                    <button id="btn-copy-output" class="btn-copy-out">Salin</button>
                </div>
                <textarea id="output-cipher-text" class="cipher-textarea" readonly></textarea>
            </div>
        </div>
        <div id="view-brute-wrapper" class="cipher-brute-wrapper cipher-hidden">
            <div id="brute-force-list"></div>
        </div>
    </div>
    <div class="cipher-lean-container">
        <button id="btn-lean-verify" class="btn-lean-verify" aria-haspopup="dialog">
            <span class="lean-check">✓</span>
            <span>Caesar Cipher: Formally Verified in Lean 4</span>
        </button>
    </div>
</main>
<script type="module" src="cipher-controller.js?v=1"></script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive sorting visualizer on Meteor - Watch Bubble Sort, Selection Sort, Insertion Sort, Quicksort, Merge Sort, and Shaker Sort at 60 FPS.">
<title>Sort - Meteor</title>
<link rel="icon" href="./assets/icons/icon-48.png" type="image/png" sizes="48x48">
<style>
@font-face {
    font-family: "Google Sans";
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url("./fonts/google-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
    font-family: "Roboto Mono";
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url("./fonts/roboto-mono-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root { --bg-main: black; --text-main: white; --font-stack: 'Google Sans', sans-serif; --space-lg: 20px; }
@media (prefers-reduced-motion) { * { transition: none !important; animation: none !important; } }
* { letter-spacing: 0.25%; padding: 0; margin: 0; box-sizing: border-box; outline: none; }
body, button { font-family: var(--font-stack); color: var(--text-main); }
body { background: var(--bg-main); }
button { cursor: pointer; background: transparent; border: none; display: flex; align-items: center; justify-content: center; padding: 0; }
#sort-menu-view { display: flex; flex-direction: column; align-items: center; padding: 60px var(--space-lg); width: 100%; min-height: 100dvh; background-color: var(--bg-main); }
.sort-title { font-size: 24px; font-weight: 400; margin-bottom: 60px; color: var(--text-main); }
.sort-filter-container { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 0 var(--space-lg); max-width: 900px; width: 100%; }
.sort-filter-btn { background: transparent; border: 1px solid #555; color: var(--text-main); padding: 8px 20px; border-radius: 20px; font-size: 14px; font-family: inherit; cursor: pointer; transition: all 0.2s ease; }
.sort-filter-btn:hover { border-color: #888; }
.sort-filter-btn.active { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }
.sort-mode-container { display: flex; gap: 8px; justify-content: center; margin-top: 24px; }
.sort-mode-btn { background: transparent; border: 1px solid #444; color: #888; padding: 6px 18px; border-radius: 16px; font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.2s ease; }
.sort-mode-btn:hover { border-color: #888; color: var(--text-main); }
.sort-mode-btn.active { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }
.sort-visualizer-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; margin-top: 40px; margin-bottom: 30px; padding: 0 var(--space-lg); max-width: 900px; }
.sort-visualizer { position: relative; width: 620px; height: 320px; flex-shrink: 0; }
.sort-canvas { width: 100%; max-width: 800px; aspect-ratio: 16 / 9; height: auto; background: transparent; display: block; }
.sort-hidden { display: none !important; }
.sort-bar { position: absolute; bottom: 0; width: 80px; background-color: #fff; transition: background-color 0.15s ease; will-change: transform; }
.sort-bar.temp { background-color: #4CAF50; }
.sort-bar.compare { background-color: #FFEB3B; }
.sort-action-container { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 20px; padding-bottom: 20px; width: 100%; }
.btn-sort-action { background: transparent; border: 1px solid #555; color: var(--text-main); padding: 8px 24px; border-radius: 20px; font-size: 14px; font-family: inherit; cursor: pointer; transition: all 0.2s ease; }
.btn-sort-action:hover:not(:disabled) { border-color: #888; background: rgba(255, 255, 255, 0.05); }
.btn-sort-action:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-run-action { background: var(--text-main); color: var(--bg-main); font-weight: 500; border-color: var(--text-main); }
.btn-run-action:hover:not(:disabled) { background: #e5e5e5; border-color: #ffffff; color: #000000; }
.sort-lean-container { display: flex; justify-content: center; padding-bottom: 40px; width: 100%; }
.btn-lean-verify { display: inline-flex; align-items: center; gap: 8px; background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; padding: 7px 18px; border-radius: 20px; font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.2s ease; text-decoration: none; }
.btn-lean-verify:hover { background: rgba(34, 197, 94, 0.18); border-color: #4ade80; transform: translateY(-1px); }
.btn-lean-verify.highlight { border-color: #4ade80; box-shadow: 0 0 12px rgba(74, 222, 128, 0.35); }
.lean-check { font-weight: 700; color: #4ade80; }
.lean-modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.lean-modal-card { background: #121212; border: 1px solid #333; border-radius: 16px; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; gap: 16px; }
.lean-modal-header { display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 14px; }
.lean-modal-title { font-size: 18px; font-weight: 600; color: #fff; }
.lean-tier-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; margin-top: 4px; }
.lean-tier-badge.tier-1 { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
.lean-tier-badge.tier-2 { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
.lean-tier-badge.tier-3 { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
.lean-modal-subtitle { font-size: 12px; color: #888; margin-top: 4px; }
.lean-modal-close { background: transparent; border: none; font-size: 24px; line-height: 1; color: #888; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: color 0.15s; }
.lean-modal-close:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.lean-modal-tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid #222; padding-bottom: 12px; }
.lean-tab-btn { background: rgba(255, 255, 255, 0.04); border: 1px solid #2a2a2a; color: #aaa; padding: 6px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.15s ease; font-family: inherit; }
.lean-tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; border-color: #444; }
.lean-tab-btn.active { background: #22c55e; color: #000; font-weight: 600; border-color: #22c55e; }
.lean-guarantee-item { background: rgba(255, 255, 255, 0.03); border: 1px solid #262626; border-radius: 10px; padding: 10px 14px; }
.lean-guarantee-title { font-size: 13px; font-weight: 600; color: #38bdf8; margin-bottom: 2px; }
.lean-guarantee-desc { font-size: 12px; color: #bbb; line-height: 1.4; }
.sort-code-panel { position: fixed; top: 0; right: 0; width: 440px; height: 100vh; background: #0c0c0c; border-left: 1px solid #242424; z-index: 1000; box-shadow: -8px 0 28px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
.sort-code-panel.sort-code-hidden { transform: translateX(100%); pointer-events: none; }
.sort-code-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #1c1c1c; background: #080808; }
.sort-code-title { font-size: 15px; font-weight: 600; color: #fff; }
.sort-code-close { background: transparent; border: none; font-size: 22px; line-height: 1; color: #888; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: color 0.15s; }
.sort-code-close:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.sort-code-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid #1c1c1c; background: #0e0e0e; }
.sort-code-tab { background: rgba(255, 255, 255, 0.04); border: 1px solid #282828; color: #aaa; padding: 5px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.15s ease; font-family: inherit; }
.sort-code-tab:hover { background: rgba(255, 255, 255, 0.08); color: #fff; border-color: #444; }
.sort-code-tab.active { background: #22c55e; color: #000; font-weight: 600; border-color: #22c55e; }
.sort-code-pre { flex: 1; overflow-x: hidden; overflow-y: auto; margin: 0; padding: 12px 0; background: #0a0a0a; font-family: 'Roboto Mono', monospace; font-size: 12.5px; line-height: 1.6; scrollbar-width: thin; scrollbar-color: #333333 transparent; }
.sort-code-pre::-webkit-scrollbar { width: 6px; }
.sort-code-pre::-webkit-scrollbar-track { background: transparent; }
.sort-code-pre::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
.sort-code-pre::-webkit-scrollbar-thumb:hover { background: #555555; }
.sort-code-body { display: block; width: 100%; box-sizing: border-box; }
.sort-code-line { display: flex; align-items: flex-start; padding: 1px 16px; border-left: 3px solid transparent; transition: background 0.1s ease, border-color 0.1s ease; }
.sort-code-line.active { background: rgba(34, 197, 94, 0.22); border-left-color: #22c55e; color: #fff; font-weight: 600; box-shadow: inset 0 0 10px rgba(34, 197, 94, 0.12); }
.sort-code-line-num { width: 32px; text-align: right; color: #555; padding-right: 14px; user-select: none; flex-shrink: 0; font-family: 'Roboto Mono', monospace; font-size: 12px; line-height: 1.6; }
.sort-code-line-text { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; flex: 1; min-width: 0; color: #e5e5e5; font-family: 'Roboto Mono', monospace; line-height: 1.6; }
.btn-code-floating { position: fixed; right: 20px; bottom: 24px; z-index: 999; background: #181818; border: 1px solid #383838; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); transition: all 0.2s ease; }
.btn-code-floating:hover { background: #222; border-color: #555; transform: translateY(-2px); }
@media (max-width: 650px) {
    .sort-visualizer-wrapper { margin-top: 30px; }
    .sort-visualizer { transform: scale(0.7); transform-origin: top center; }
    .sort-code-panel { width: 100vw; }
}
@media (max-width: 480px) {
    .sort-visualizer-wrapper { margin-top: 20px; }
    .sort-visualizer { transform: scale(0.5); transform-origin: top center; }
}
</style>
</head>
<body>
<main id="sort-menu-view">
    <h2 class="sort-title">Sort</h2>
    <div id="sort-filter-container" class="sort-filter-container">
        <button class="sort-filter-btn active" data-sort="bubble">Bubble Sort</button>
        <button class="sort-filter-btn" data-sort="selection">Selection Sort</button>
        <button class="sort-filter-btn" data-sort="insertion">Insertion Sort</button>
        <button class="sort-filter-btn" data-sort="quick">Quick Sort</button>
        <button class="sort-filter-btn" data-sort="merge">Merge Sort</button>
        <button class="sort-filter-btn" data-sort="shaker">Shaker Sort</button>
    </div>
    <div id="sort-mode-container" class="sort-mode-container">
        <button id="btn-mode-bar" class="sort-mode-btn active" data-mode="bar">Bar</button>
        <button id="btn-mode-color" class="sort-mode-btn" data-mode="color">Warna</button>
    </div>
    <div class="sort-visualizer-wrapper">
        <div id="sort-visualizer" class="sort-visualizer"></div>
        <canvas id="sort-canvas" class="sort-canvas sort-hidden" width="800" height="450"></canvas>
    </div>
    <div class="sort-action-container">
        <button id="btn-run" class="btn-sort-action btn-run-action">Run</button>
        <button id="btn-randomize" class="btn-sort-action">Randomize</button>
        <button id="btn-worst" class="btn-sort-action">Worst</button>
        <button id="btn-toggle-code" class="btn-sort-action">Code</button>
    </div>
    <div id="sort-lean-container" class="sort-lean-container">
        <button id="btn-lean-verify" class="btn-lean-verify" aria-haspopup="dialog">
            <span class="lean-check">✓</span>
            <span class="lean-text" id="lean-badge-text">Verified in Lean 4: Bubble, Insertion & Merge Sort</span>
        </button>
    </div>
</main>
<button id="btn-code-floating" class="btn-code-floating" aria-label="Toggle Code Panel">&lang;/&rang; Code</button>
<script type="module" src="./src/lab/sort/sort-controller.js?v=17"></script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive sorting visualizer on Meteor - Watch Bubble Sort, Selection Sort, Insertion Sort, Quicksort, Merge Sort, and Shaker Sort at 60 FPS.">
<title>Sort - Meteor</title>
<link rel="icon" href="./icon-48.png" type="image/png" sizes="48x48">
<style>
@font-face {
    font-family: "Google Sans";
    font-style: normal;
    font-weight: 400 600;
    font-display: swap;
    src: url("./fonts/google-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root { --bg-main: black; --text-main: white; --font-stack: 'Google Sans', sans-serif; --space-lg: 20px; }
@media (prefers-reduced-motion) { * { transition: none !important; animation: none !important; } }
* { letter-spacing: 0.25%; padding: 0; margin: 0; box-sizing: border-box; outline: none; }
body, button { font-family: var(--font-stack); color: var(--text-main); }
body { background: var(--bg-main); }
button { cursor: pointer; background: transparent; border: none; display: flex; align-items: center; justify-content: center; padding: 0; }
#sort-menu-view { display: flex; flex-direction: column; align-items: center; padding: 60px var(--space-lg); width: 100%; min-height: 100dvh; background-color: var(--bg-main); }
.sort-title { font-size: 24px; font-weight: 400; margin-bottom: 60px; color: var(--text-main); }
.sort-filter-container { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 0 var(--space-lg); max-width: 900px; width: 100%; }
.sort-filter-btn { background: transparent; border: 1px solid #555; color: var(--text-main); padding: 8px 20px; border-radius: 20px; font-size: 14px; font-family: inherit; cursor: pointer; transition: all 0.2s ease; }
.sort-filter-btn:hover { border-color: #888; }
.sort-filter-btn.active { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }
.sort-mode-container { display: flex; gap: 8px; justify-content: center; margin-top: 24px; }
.sort-mode-btn { background: transparent; border: 1px solid #444; color: #888; padding: 6px 18px; border-radius: 16px; font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.2s ease; }
.sort-mode-btn:hover { border-color: #888; color: var(--text-main); }
.sort-mode-btn.active { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }
.sort-visualizer-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; margin-top: 40px; margin-bottom: 30px; padding: 0 var(--space-lg); max-width: 900px; }
.sort-visualizer { position: relative; width: 620px; height: 320px; }
.sort-canvas { width: 100%; max-width: 800px; aspect-ratio: 16 / 9; height: auto; background-color: #161616; border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4); display: block; }
.sort-hidden { display: none !important; }
.sort-bar { position: absolute; bottom: 0; width: 80px; background-color: #fff; transition: background-color 0.2s ease; will-change: transform; }
.sort-bar.temp { background-color: #4CAF50; }
.sort-action-container { display: flex; justify-content: center; margin-top: 20px; padding-bottom: 40px; width: 100%; }
.btn-sort-action { background: transparent; border: 1px solid #555; color: var(--text-main); padding: 8px 24px; border-radius: 20px; font-size: 14px; font-family: inherit; cursor: pointer; transition: all 0.2s ease; }
.btn-sort-action:hover:not(:disabled) { border-color: #888; background: rgba(255, 255, 255, 0.05); }
.btn-sort-action:disabled { opacity: 0.5; cursor: not-allowed; }
@media (max-width: 650px) {
    .sort-visualizer-wrapper { margin-top: 30px; }
    .sort-visualizer { transform: scale(0.7); transform-origin: top center; }
}
@media (max-width: 480px) {
    .sort-visualizer-wrapper { margin-top: 20px; }
    .sort-visualizer { transform: scale(0.5); transform-origin: top center; }
}
</style>
</head>
<body>
<main id="sort-menu-view">
    <h2 class="sort-title">Sort</h2>
    <div id="sort-filter-container" class="sort-filter-container">
        <button class="sort-filter-btn" data-sort="bubble">Bubble Sort</button>
        <button class="sort-filter-btn" data-sort="selection">Selection Sort</button>
        <button class="sort-filter-btn" data-sort="insertion">Insertion Sort</button>
        <button class="sort-filter-btn" data-sort="quick">Quick Sort</button>
        <button class="sort-filter-btn" data-sort="merge">Merge Sort</button>
        <button class="sort-filter-btn" data-sort="shaker">Shaker Sort</button>
    </div>
    <div id="sort-mode-container" class="sort-mode-container">
        <button id="btn-mode-bar" class="sort-mode-btn active" data-mode="bar">Bar</button>
        <button id="btn-mode-color" class="sort-mode-btn" data-mode="color">Warna</button>
    </div>
    <div class="sort-visualizer-wrapper">
        <div id="sort-visualizer" class="sort-visualizer"></div>
        <canvas id="sort-canvas" class="sort-canvas sort-hidden" width="800" height="450"></canvas>
    </div>
    <div class="sort-action-container">
        <button id="btn-randomize" class="btn-sort-action">Randomize</button>
    </div>
</main>
<script type="module" src="sort-controller.js?v=5"></script>
</body>
</html>
